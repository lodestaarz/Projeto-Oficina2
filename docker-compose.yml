# Banco de dados para desenvolvimento local.
# Suba com: npm run db:up  (ou docker compose up -d db)
services:
  db:
    image: postgres:16-alpine
    container_name: arrowbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-arrowbot}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-arrowbot}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
